<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chat AI + RAG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #box { height: calc(100vh - 150px); overflow-y: auto; }
        #historyList { max-height: calc(100vh - 330px); overflow-y: auto; }
        .msg { max-width: 75%; white-space: pre-wrap; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid py-3">
    <div class="row g-3">
        <div class="col-md-3">
            <a href="/" class="btn btn-primary w-100 mb-3">+ Đoạn chat mới</a>

            <div class="card mb-3"><div class="card-body">
                <h6 class="card-title">Cấu hình</h6>
                <label class="form-label small">Nền tảng AI</label>
                <select id="provider" class="form-select form-select-sm mb-2">
                    <option value="gemini" th:selected="${provider == 'gemini'}">Google Gemini</option>
                    <option value="groq" th:selected="${provider == 'groq'}">Groq</option>
                </select>
                <div class="form-check form-switch">
                    <input id="rag" class="form-check-input" type="checkbox" role="switch">
                    <label class="form-check-label small" for="rag">Chế độ RAG (hỏi theo quy chế thi FPT)</label>
                </div>
            </div></div>

            <div class="card"><div class="card-body p-2">
                <h6 class="card-title px-2 pt-1 mb-2">Lịch sử chat</h6>
                <div id="historyList" class="list-group list-group-flush">
                    <div th:each="s : ${sessions}"
                         th:id="'sess-' + ${s.id}"
                         class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-2"
                         th:classappend="${s.id == activeSessionId} ? 'active' : ''">
                        <a th:href="@{/(sessionId=${s.id})}"
                           th:text="${s.title}"
                           class="text-truncate text-decoration-none flex-grow-1 me-2"
                           th:classappend="${s.id == activeSessionId} ? 'text-white' : 'text-dark'"></a>
                        <form th:action="@{/sessions/{id}/delete(id=${s.id})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-sm py-0 px-1"
                                    th:classappend="${s.id == activeSessionId} ? 'btn-outline-light' : 'btn-outline-danger'"
                                    title="Xóa">&times;</button>
                        </form>
                    </div>
                </div>
            </div></div>
        </div>

        <div class="col-md-9">
            <div id="box" class="border rounded bg-white p-3 mb-2">
                <th:block th:each="m : ${messages}">
                    <div class="d-flex mb-2 justify-content-end">
                        <div class="msg p-2 rounded bg-primary text-white" th:text="${m.question}"></div>
                    </div>
                    <div class="d-flex mb-2">
                        <div class="msg ai-msg p-2 rounded bg-light border" th:text="${m.answer}"></div>
                    </div>
                </th:block>
            </div>
            <form id="form" class="input-group">
                <input id="input" class="form-control" placeholder="Nhập câu hỏi..." autocomplete="off" required>
                <button class="btn btn-primary" type="submit">Gửi</button>
            </form>
        </div>
    </div>
</div>
<script th:inline="javascript">
    let sessionId = /*[[${activeSessionId}]]*/ null;
    const box = document.getElementById('box');

    function formatMd(el, text) {
        el.textContent = text;
        el.innerHTML = el.innerHTML
            .replace(/\*\*(.+?)\*\*/gs, '<strong>$1</strong>')
            .replace(/`([^`\n]+)`/g, '<code>$1</code>');
    }

    document.querySelectorAll('.ai-msg').forEach(el => formatMd(el, el.textContent));
    box.scrollTop = box.scrollHeight;

    function add(text, cls) {
        const row = document.createElement('div');
        row.className = 'd-flex mb-2 ' + (cls === 'user' ? 'justify-content-end' : '');
        const m = document.createElement('div');
        m.className = 'msg p-2 rounded ' + ({user: 'bg-primary text-white', ai: 'bg-light border', err: 'bg-danger-subtle'}[cls]);
        if (cls === 'ai') formatMd(m, text); else m.textContent = text;
        row.appendChild(m);
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
        return m;
    }

    function ensureSessionInSidebar(id, title) {
        if (document.getElementById('sess-' + id)) return;
        const list = document.getElementById('historyList');
        const item = document.createElement('div');
        item.id = 'sess-' + id;
        item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center p-2 active';
        const link = document.createElement('a');
        link.href = '/?sessionId=' + id;
        link.className = 'text-truncate text-decoration-none flex-grow-1 me-2 text-white';
        link.textContent = title;
        const form = document.createElement('form');
        form.action = '/sessions/' + id + '/delete';
        form.method = 'post';
        form.className = 'm-0';
        form.innerHTML = '<button type="submit" class="btn btn-sm py-0 px-1 btn-outline-light" title="Xóa">&times;</button>';
        item.append(link, form);
        list.prepend(item);
        history.replaceState(null, '', '/?sessionId=' + id);
    }

    document.getElementById('form').addEventListener('submit', async e => {
        e.preventDefault();
        const input = document.getElementById('input');
        const message = input.value.trim();
        if (!message) return;
        input.value = '';
        add(message, 'user');
        const wait = add('Đang trả lời...', 'ai');
        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sessionId,
                    message,
                    provider: document.getElementById('provider').value,
                    rag: document.getElementById('rag').checked
                })
            });
            const data = await res.json();
            if (!res.ok) {
                wait.textContent = data.error;
                wait.className = 'msg p-2 rounded bg-danger-subtle';
            } else {
                formatMd(wait, data.reply);
                if (data.sessionId) {
                    sessionId = data.sessionId;
                    ensureSessionInSidebar(data.sessionId, data.title);
                }
            }
        } catch (err) {
            wait.textContent = 'Lỗi kết nối: ' + err;
            wait.className = 'msg p-2 rounded bg-danger-subtle';
        }
    });
</script>
</body>
</html>
